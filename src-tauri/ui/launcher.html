<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>选择 MoeFlow 实例</title>
<style>
  /* Every colour is a variable defined once per scheme. Scattering `!important` overrides
     through the dark block is how a white button ended up with near-white text on it: the
     base rule set `background:#fff; color:inherit`, and `inherit` in a dark document is a
     light colour. Defining both sides of every pair keeps that from happening again. */
  :root {
    color-scheme: light dark;
    --brand: #ff657c;
    --brand-link: #c9344f;
    --brand-soft: rgba(255, 101, 124, .14);
    --bg: #fdf4f6;
    --panel: #ffffff;
    --border: #f0dfe3;
    --border-row: #e6e9ee;
    --text: #1f2328;
    --text-muted: #6b7280;
    --button-bg: #ffffff;
    --button-border: #d8dde4;
    --button-text: #1f2328;
    --button-hover: #f3f4f6;
    --row-hover: #fff8f9;
    --input-bg: #ffffff;
    --input-border: #d8dde4;
    --divider: rgba(128, 128, 128, .22);
    --ok: #1a7f37;
    --err: #cf222e;
    --shadow: 0 6px 24px rgba(217, 76, 102, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* Lifted from the light-mode brand: the old --brand-dark read as a smudge on a dark
         panel, which is exactly the "too close to the background" complaint. */
      --brand-link: #ff9aa9;
      --bg: #1b1f24;
      --panel: #22272e;
      --border: #343b43;
      --border-row: #343b43;
      --text: #e6e8eb;
      --text-muted: #9aa4ae;
      --button-bg: #2d333b;
      --button-border: #444c56;
      --button-text: #e6e8eb;
      --button-hover: #373e47;
      --row-hover: #2a3138;
      --input-bg: #1b1f24;
      --input-border: #444c56;
      --divider: rgba(200, 200, 200, .18);
      --ok: #3fb950;
      /* #f85149 on these backgrounds is 3.8:1 — legible-ish but under AA. */
      --err: #ff8a80;
      --shadow: 0 6px 24px rgba(0, 0, 0, .4);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
    background: var(--bg);
  }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .02em; }
  header p { margin: 0; font-size: 12px; }

  .panel {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .instances { display: flex; flex-direction: column; gap: 8px; }
  .instances:empty::after {
    content: "还没有配置任何实例，点右下角「设置」添加一个。";
    display: block;
    padding: 18px 4px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  .instance {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-row);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .instance:hover { border-color: var(--brand); background: var(--row-hover); }
  .instance:active { transform: translateY(1px); }
  .instance .body { flex: 1; min-width: 0; }
  .instance .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .instance .url {
    font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    font-size: 11px; padding: 1px 7px; border-radius: 9px;
    background: var(--brand-soft); color: var(--brand-link);
  }
  .chev { color: var(--brand); font-size: 16px; flex-shrink: 0; }

  .muted { color: var(--text-muted); font-size: 12px; }

  .footer {
    display: flex; align-items: center; gap: 8px;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--divider);
  }
  .footer .spacer { flex: 1; }

  button {
    font: inherit; padding: 7px 15px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--button-border);
    background: var(--button-bg);
    color: var(--button-text);
  }
  button:hover { border-color: var(--brand); background: var(--button-hover); }

  .error {
    margin-top: 10px; font-size: 12px; min-height: 1.5em;
    color: var(--err);
  }

  .remember {
    display: flex; align-items: center; gap: 7px;
    margin-top: 14px; justify-content: center; font-size: 12px;
    color: var(--text-muted);
  }
  .remember input { accent-color: var(--brand); }
</style>
</head>
<body>
<header>
  <h1>MoeFlow</h1>
  <p class="muted">选择要连接的实例</p>
</header>

<div class="panel">
  <div class="instances" id="instances"></div>

  <div class="footer">
    <span class="spacer"></span>
    <button id="btn-settings">设置</button>
  </div>
  <div class="error" id="error"></div>

  <label class="remember">
    <input type="checkbox" id="skip" />
    启动时直接进入上次使用的实例
  </label>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);

let state = { profiles: [], active: "", active_port: 0, skip_launcher: false, cache: null };

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function render() {
  const box = $("instances");
  box.innerHTML = "";
  for (const p of state.profiles) {
    const button = document.createElement("button");
    button.className = "instance";
    button.innerHTML = `
      <span class="body">
        <span class="name">
          ${escapeHtml(p.name)}
          ${p.id === state.active ? '<span class="badge">上次使用</span>' : ""}
        </span>
        <span class="url">${escapeHtml(p.api_base)}</span>
      </span>
      <span class="chev">›</span>
    `;
    button.onclick = () => connect(p.id);
    box.appendChild(button);
  }
}

function showError(err) {
  $("error").textContent = err ? String(err.message ?? err) : "";
}

// Rust navigates the main window to this instance's loopback origin and hides this one.
async function connect(id) {
  showError("");
  try {
    await invoke("set_active_profile", { id });
  } catch (err) {
    showError(err);
  }
}

function applyPayload(payload) {
  state = payload;
  $("skip").checked = !!payload.skip_launcher;
  render();
}

async function refresh() {
  try {
    applyPayload(await invoke("boot_payload"));
  } catch (err) {
    showError(err);
  }
}

// Adding and editing instances lives in the settings window. Keeping one list here and one
// editor there means this page has exactly one job — pick where to connect.
$("btn-settings").onclick = () => invoke("open_settings").catch(showError);

$("skip").onchange = async () => {
  try {
    applyPayload(await invoke("set_skip_launcher", { skip: $("skip").checked }));
  } catch (err) {
    showError(err);
  }
};

// The settings window can add, edit and delete instances, so re-read the list whenever this
// page comes back — rather than trusting the snapshot taken at load. Both events are
// listened for: which one fires when a native window is shown depends on the shell.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh();
});
window.addEventListener("focus", refresh);

(async () => {
  await refresh();
})();
</script>
</body>
</html>
