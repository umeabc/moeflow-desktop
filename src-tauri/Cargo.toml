[package]
name = "moeflow-desktop"
version = "0.1.0"
description = "MoeFlow desktop client"
authors = ["moeflow-desktop"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "moeflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["query"] }
http = "1"
bytes = "1"
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "json",
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls",
    "http2",
    "charset",
] }

zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
mime_guess = "2"
thiserror = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
