name: build

# Cross-platform release builds.
#
# macOS cannot be built anywhere but macOS, so a Linux/Windows dev box can only ever
# produce its own artifacts. This workflow is the way to get all three from one place,
# and it is the only practical way to test the macOS bundle before shipping it.
#
# Runs on demand, and on every v* tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others — a broken Linux bundle is no
      # reason to throw away a good macOS one.
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            args: ""
          - label: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
          - label: linux-x64
            os: ubuntu-22.04
            args: ""

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK 4.1 is the Linux webview and must be present at *build* time to link;
      # libayatana-appindicator3 is the tray backend. `rpm` provides rpmbuild for the rpm
      # bundle target — without it that target fails rather than being skipped.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary needs both slices available to lipo them together.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The upstream frontend is vendored, not committed (`/frontend/` is gitignored),
      # so every build fetches it fresh at the pinned commit.
      - name: Vendor the upstream frontend
        shell: bash
        run: bash scripts/fetch-frontend.sh

      - name: Install the Tauri CLI
        run: npm install

      - name: Build the frontend bundle
        shell: bash
        run: bash scripts/build-frontend.sh

      - name: Build the app
        shell: bash
        # NO_PROXY only matters on Windows, where the WebView2 bootstrapper is fetched
        # from go.microsoft.com at build time. Harmless elsewhere.
        env:
          NO_PROXY: "go.microsoft.com,microsoft.com"
        run: npx tauri build ${{ matrix.args }}

      # The icon set (`icons/icon.icns`, `icon.ico`, PNGs) is committed, so `tauri icon`
      # is deliberately NOT run here: regenerating it every build only adds a way to
      # fail. Refresh it locally when the logo changes.

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: moeflow-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
